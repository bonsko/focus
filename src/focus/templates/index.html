{% extends "base.html" %}
{% block title %}{{ project['name'] }} · focus{% endblock %}
{% block main %}
<header class="page-head">
  <h1>{{ project['name'] }}</h1>
  <p class="hints">
    <kbd>n</kbd> new
    <kbd>j</kbd><kbd>k</kbd> move
    <kbd>x</kbd> done
    <kbd>/</kbd> search
  </p>
</header>

<div class="search-row">
  <input id="search" type="search" name="q" placeholder="search" autocomplete="off"
         hx-get="/search" hx-target="#list" hx-swap="innerHTML"
         hx-trigger="input changed delay:250ms, search" aria-label="search tasks">
</div>

<form id="add-form" class="add" hx-post="/p/{{ project['id'] }}/tasks" hx-target="#list" hx-swap="innerHTML"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <input id="new-task" name="title" placeholder="what's next?" autocomplete="off" maxlength="500" aria-label="new task">
</form>

<div id="list">
  {% include "partials/task_list.html" %}
</div>
{% endblock %}
