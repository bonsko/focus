<!doctype html>
<html lang="en" style="zoom:{{ scale(request) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}focus{% endblock %}</title>
  <style>{{ theme_css(user) }}</style>
  <link rel="stylesheet" href="/static/css/rose-pine.css?v=20261109b">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/js/confetti.js?v=20261109b" defer></script>
  <script src="/static/js/app.js?v=20261109b" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-flower" aria-hidden="true">🌸</span> focus</a>

    <nav class="projects" aria-label="projects">
      <a class="ramble-link" href="/ramble">ramble ✦</a>
      {% for p in projects %}
      <div class="project-row">
        <a class="project{% if project and p['id'] == project['id'] %} active{% endif %}" href="/p/{{ p['id'] }}">{{ p['name'] }}</a>
        <button class="quiet tiny" type="button" title="delete project" aria-label="delete project {{ p['name'] }}"
                hx-post="/projects/{{ p['id'] }}/delete" hx-swap="none"
                hx-confirm="delete “{{ p['name'] }}”? it has to be empty.">×</button>
      </div>
      {% endfor %}
      <form class="new-project" method="post" action="/projects">
        <input name="name" placeholder="+ project" maxlength="40" autocomplete="off" aria-label="new project">
      </form>
    </nav>

    <div class="side-foot">
      <a class="me" href="/settings">
        {% if user and user['avatar'] %}
        <img class="avatar" src="/avatars/{{ user['avatar'] }}" alt="" width="22" height="22">
        {% else %}
        <span class="avatar initial">{{ user['display_name']|initial if user else '?' }}</span>
        {% endif %}
        <span class="me-name">{{ user['display_name'] if user else '' }}</span>
      </a>
    </div>
  </aside>

  <main class="main">
    {% block main %}{% endblock %}
  </main>
</div>

<aside id="sheet" class="sheet" aria-live="polite"></aside>
</body>
</html>
