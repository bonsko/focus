{% extends "base.html" %}
{% block title %}ramble · focus{% endblock %}

{% block main %}
<header class="page-head">
  <h1>ramble</h1>
  <p class="hints">
    <span>dump it all here — hermes turns it into tasks</span>
  </p>
</header>

<form class="ramble-form" hx-post="/ramble" hx-target="#ramble-panel" hx-swap="innerHTML"
      hx-on::after-request="if (event.detail.successful) this.reset()">
  <textarea name="text" rows="8" required placeholder="everything on your mind, one thing per line…"
            aria-label="rambles"></textarea>
  <div class="ramble-actions">
    <button class="quiet" type="submit">turn into tasks</button>
    <span class="hint">nothing is saved until you accept the list</span>
  </div>
</form>

<div id="ramble-panel"></div>
{% endblock %}
