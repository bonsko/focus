{% extends "base.html" %}
{% block title %}settings · focus{% endblock %}
{% block main %}
<header class="page-head">
  <h1>settings</h1>
  <a class="back" href="/p/{{ projects[0]['id'] }}">← back</a>
</header>

{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

<form class="settings-form" method="post" action="/settings">
  <label>
    <span>display name</span>
    <input name="display_name" value="{{ user['display_name'] }}" maxlength="40" autocomplete="nickname">
  </label>
  <label>
    <span>light theme</span>
    <select name="theme_light">
      {% for slug, name in light_themes %}
      <option value="{{ slug }}"{% if user['theme_light'] == slug %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    <span>dark theme</span>
    <select name="theme_dark">
      {% for slug, name in dark_themes %}
      <option value="{{ slug }}"{% if user['theme_dark'] == slug %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="quiet">save</button>
</form>

<form class="settings-form">
  <label>
    <span>scale <small class="hint">this device only</small></span>
    <select id="scale-pick" aria-label="interface scale">
      {% for s in scales %}
      <option value="{{ s }}"{% if scale(request) == s %} selected{% endif %}>{{ (s|float * 100)|round|int }}%</option>
      {% endfor %}
    </select>
  </label>
  <small class="hint">stored in a cookie, so your laptop and your phone can differ.</small>
</form>

<form class="settings-form" method="post" action="/settings/avatar" enctype="multipart/form-data">
  <label>
    <span>avatar</span>
    <input type="file" name="avatar" accept="image/*" required>
  </label>
  <button class="quiet">upload</button>
  <small class="hint">scaled to 96px and stored locally.</small>
</form>

<form class="settings-form" method="post" action="/logout">
  <button class="quiet danger">sign out</button>
</form>
{% endblock %}
