<!doctype html>
<html lang="en" style="zoom:{{ scale(request) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <meta name="color-scheme" content="dark light">
  <title>focus</title>
  <style>{{ theme_css(None) }}</style>
  <link rel="stylesheet" href="/static/css/rose-pine.css?v=20261108d">
</head>
<body class="login-page">
  <main class="login">
    <h1>focus</h1>
    <p class="tagline">a quiet place for the next thing.</p>
    <form method="post" action="/login">
      <input name="username" placeholder="name" autocomplete="username" maxlength="32" required autofocus>
      <input type="password" name="password" placeholder="password" autocomplete="current-password" required>
      <button>enter</button>
    </form>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <p class="hint">no account needed. the name you type becomes yours.</p>
  </main>
</body>
</html>
