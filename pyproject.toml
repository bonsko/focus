[project]
name = "focus"
version = "0.1.0"
description = "a quiet personal task tracker for one brain at a time"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "sucrose" }]
dependencies = [
    "fastapi>=0.162.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
focus = "focus.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # fastapi Depends() in defaults is the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
